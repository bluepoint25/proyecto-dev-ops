name: CI/CD - Backend

# Pipeline completo del microservicio:
#   test -> sonar (quality gate) -> build-image -> scan-image -> deploy-staging
# Cada etapa depende de la anterior: si una falla, el cambio queda bloqueado.
on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "docker-compose.yml", "k8s/**", ".github/workflows/cicd-backend.yml"]
  pull_request:
    branches: [main, develop]   # develop: PRs de Dependabot y de feature/*
    paths: ["backend/**", "docker-compose.yml", "k8s/**", ".github/workflows/cicd-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  # En main no se cancela para no cortar un push de imagen a medias
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pedidos360-backend

jobs:
  # ── 1. Pruebas unitarias + cobertura (Jacoco). Falla bajo el minimo de cobertura ──
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura minima
        run: mvn --batch-mode verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: backend/target/site/jacoco

      - name: Resumen de pruebas en el job
        if: always()
        run: |
          echo "### Pruebas unitarias" >> "$GITHUB_STEP_SUMMARY"
          grep -h -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' target/surefire-reports/*.xml >> "$GITHUB_STEP_SUMMARY" || true

  # ── 2. Analisis estatico SonarCloud. El quality gate BLOQUEA el pipeline ──
  sonar:
    name: Analisis de codigo (SonarCloud)
    runs-on: ubuntu-latest
    needs: test
    # Los PR de forks y de Dependabot no reciben secretos; ahi el control de
    # seguridad lo da dependency-review + Trivy
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificar que existe el token de Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secret SONAR_TOKEN. Crearlo en SonarCloud y agregarlo en Settings > Secrets (ver README)."
            exit 1
          fi

      - name: Analizar con SonarCloud y esperar el quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.qualitygate.wait=true

  # ── 2b. Escaneo de dependencias en PR: bloquea vulnerabilidades altas nuevas ──
  dependency-review:
    name: Revision de dependencias
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── 3. Construccion de la imagen Docker ──
  build-image:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    # always() + checks: build-image tambien corre cuando sonar se omite (PR de
    # fork/Dependabot), pero nunca si test o sonar fallaron
    needs: [test, sonar]
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    permissions:
      contents: read
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Calcular nombre de la imagen (en minusculas, tag = SHA del commit)
        id: ref
        run: |
          IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "base=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen (cargada localmente para escanearla)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar imagen como artefacto para las etapas siguientes
        run: docker save "${{ steps.ref.outputs.image }}" | gzip > imagen.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: imagen.tar.gz
          retention-days: 3

  # ── 4. Escaneo de vulnerabilidades de la imagen. HIGH/CRITICAL bloquean ──
  scan-image:
    name: Escaneo de seguridad (Trivy)
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker

      - name: Cargar imagen
        run: gunzip -c imagen.tar.gz | docker load

      - name: Trivy - bloquear si hay vulnerabilidades corregibles HIGH o CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ── 5. Despliegue automatico en entorno simulado (Docker Compose en el runner) ──
  deploy-staging:
    name: Desplegar en staging (simulado)
    runs-on: ubuntu-latest
    needs: [build-image, scan-image, validar-k8s]
    # Solo se despliega desde ramas de integracion, nunca desde un PR
    if: github.event_name != 'pull_request'
    environment:
      name: staging
    permissions:
      contents: read
      packages: write
    env:
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD || 'pedidos_ci' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker

      - name: Cargar imagen construida
        run: gunzip -c imagen.tar.gz | docker load

      - name: Levantar el stack con Docker Compose y esperar a que este saludable
        env:
          BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test - health y version desplegada
        run: |
          curl -fsS http://localhost:8080/actuator/health
          echo
          curl -fsS http://localhost:8080/info | tee info.json
          echo
          # Trazabilidad: el servicio en ejecucion informa el commit que lo construyo
          grep -q "\"commit\":\"${GITHUB_SHA}\"" info.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/productos)" = "401"
          echo "OK: /productos exige autenticacion (401 sin token)"

      - name: Trazabilidad - verificar el commit de la imagen en ejecucion
        env:
          BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          REV=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BACKEND_IMAGE")
          echo "Imagen desplegada: $BACKEND_IMAGE"
          echo "Commit en la imagen: $REV"
          test "$REV" = "$GITHUB_SHA"
          {
            echo "### Despliegue en staging"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Rama: \`$GITHUB_REF_NAME\`"
            echo "- Imagen: \`$BACKEND_IMAGE\`"
            echo "- Ejecutado por: @$GITHUB_ACTOR (run $GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs del backend si algo falla
        if: failure()
        run: docker compose logs --no-color backend db | tail -100

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

      # Publicar en el registro solo desde main (la "produccion" del flujo GitFlow)
      - name: Login en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR (tag SHA y latest)
        if: github.ref == 'refs/heads/main'
        env:
          BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          BASE="${BACKEND_IMAGE%:*}"
          docker tag "$BACKEND_IMAGE" "$BASE:latest"
          docker push "$BACKEND_IMAGE"
          docker push "$BASE:latest"

  # ── 6. Validacion de los manifiestos de Kubernetes (orquestacion) ──
  validar-k8s:
    name: Validar manifiestos Kubernetes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform - validar esquema de los manifiestos
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
