name: CI/CD - Backend

# Pipeline completo del microservicio:
#   test -> sonar (SonarQube, quality gate) -> build-image -> scan-image -> deploy-staging
# Cada etapa depende de la anterior: si una falla, el cambio queda bloqueado.
on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "frontend/**", "docker-compose.yml", "k8s/**", ".github/workflows/cicd-backend.yml"]
  pull_request:
    branches: [main, develop]   # develop: PRs de Dependabot y de feature/*
    paths: ["backend/**", "frontend/**", "docker-compose.yml", "k8s/**", ".github/workflows/cicd-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  # En main no se cancela para no cortar un push de imagen a medias
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── 1. Pruebas unitarias + cobertura (Jacoco). Falla bajo el minimo de cobertura ──
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura minima
        run: mvn --batch-mode verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporte-jacoco
          path: backend/target/site/jacoco

      - name: Resumen de pruebas en el job
        if: always()
        run: |
          echo "### Pruebas unitarias" >> "$GITHUB_STEP_SUMMARY"
          grep -h -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' target/surefire-reports/*.xml >> "$GITHUB_STEP_SUMMARY" || true

  # ── 2. Analisis estatico con SonarQube Community (contenedor efimero, gratis). El quality gate BLOQUEA ──
  sonar:
    name: Analisis de codigo (SonarQube)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # SonarQube Community corre como contenedor efimero dentro del runner:
      # sin cuenta, sin costo y sin secretos. Las credenciales por defecto solo
      # existen mientras vive este contenedor de CI.
      - name: Levantar SonarQube Community
        working-directory: .
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community
          for i in $(seq 1 60); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[A-Z_]*"' || true)
            echo "intento $i: $STATUS"
            [ "$STATUS" = '"status":"UP"' ] && exit 0
            sleep 5
          done
          docker logs sonarqube | tail -50
          exit 1

      - name: Generar token temporal
        id: token
        working-directory: .
        run: |
          TOKEN=$(curl -fsS -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-${GITHUB_RUN_ID}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Analizar y esperar el quality gate (bloquea si falla)
        env:
          SONAR_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      - name: Resumen del analisis
        if: always()
        working-directory: .
        run: |
          {
            echo "### SonarQube"
            curl -s -u admin:admin "http://localhost:9000/api/measures/component?component=bluepoint25_proyecto-dev-ops&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density"               | jq -r '.component.measures[]? | "- \(.metric): \(.value)"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bajar SonarQube
        if: always()
        working-directory: .
        run: docker rm -f sonarqube

  # ── 2b. Escaneo de dependencias en PR: bloquea vulnerabilidades altas nuevas ──
  dependency-review:
    name: Revision de dependencias
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # ── 2c. Busqueda de secretos filtrados en el historial (gitleaks). Bloquea ──
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: gitleaks detect (falla si encuentra credenciales)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  # ── 3. Construccion de las imagenes Docker (backend y frontend) ──
  build-image:
    name: Construir imagenes Docker
    runs-on: ubuntu-latest
    needs: [test, sonar, secretos]
    if: >-
      always() && needs.test.result == 'success' && needs.secretos.result == 'success' &&
      needs.sonar.result == 'success'
    permissions:
      contents: read
    outputs:
      image: ${{ steps.ref.outputs.image }}
      frontend: ${{ steps.ref.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Calcular nombres de imagen (minusculas, tag = SHA del commit)
        id: ref
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/pedidos360-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/pedidos360-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen del backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          load: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir imagen del frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          load: true
          tags: ${{ steps.ref.outputs.frontend }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Guardar imagenes como artefacto para las etapas siguientes
        run: docker save "${{ steps.ref.outputs.image }}" "${{ steps.ref.outputs.frontend }}" | gzip > imagen.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imagen-docker
          path: imagen.tar.gz
          retention-days: 3

  # ── 4. Escaneo de vulnerabilidades de las imagenes. HIGH/CRITICAL bloquean ──
  scan-image:
    name: Escaneo de seguridad (Trivy)
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imagen-docker

      - name: Cargar imagenes
        run: gunzip -c imagen.tar.gz | docker load

      - name: Trivy backend - bloquear HIGH/CRITICAL con correccion disponible
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (0.28.0 estaba en el rango comprometido, mar-2026)
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          # Binario seguro de Trivy (versiones posteriores del incidente de marzo 2026 estuvieron comprometidas)
          version: v0.69.3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy frontend - bloquear HIGH/CRITICAL con correccion disponible
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.build-image.outputs.frontend }}
          version: v0.69.3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ── 5. Despliegue automatico en staging (entorno cloud simulado: Docker Compose) ──
  deploy-staging:
    name: Desplegar en staging (simulado)
    runs-on: ubuntu-latest
    needs: [build-image, scan-image, validar-k8s, k8s-kind]
    # Solo se despliega desde ramas de integracion, nunca desde un PR
    if: github.event_name != 'pull_request'
    environment:
      name: staging
    permissions:
      contents: read
    env:
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD || 'pedidos_ci' }}
      BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
      FRONTEND_IMAGE: ${{ needs.build-image.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imagen-docker

      - name: Cargar imagenes construidas
        run: gunzip -c imagen.tar.gz | docker load

      - name: Levantar el stack con Docker Compose y esperar a que este saludable
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test - health, version desplegada y frontend
        run: |
          curl -fsS http://localhost:8080/actuator/health
          echo
          curl -fsS http://localhost:8080/info | tee info.json
          echo
          # Trazabilidad: el servicio en ejecucion informa el commit que lo construyo
          grep -q "\"commit\":\"${GITHUB_SHA}\"" info.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/productos)" = "401"
          echo "OK: /productos exige autenticacion (401 sin token)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/)" = "200"
          echo "OK: frontend sirve la SPA"

      - name: Trazabilidad - verificar el commit de las imagenes
        run: |
          for IMG in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            REV=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMG")
            echo "$IMG -> commit $REV"
            test "$REV" = "$GITHUB_SHA"
          done
          {
            echo "### Despliegue en staging"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Rama: \`$GITHUB_REF_NAME\`"
            echo "- Backend: \`$BACKEND_IMAGE\`"
            echo "- Frontend: \`$FRONTEND_IMAGE\`"
            echo "- Ejecutado por: @$GITHUB_ACTOR (run $GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color | tail -150

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  # ── 6. Release a produccion: solo desde main, con aprobacion del entorno ──
  # Configurar en Settings > Environments > production > Required reviewers.
  release-produccion:
    name: Publicar release (produccion)
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: write   # crear tag y release
      packages: write   # publicar imagenes en GHCR
    env:
      BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
      FRONTEND_IMAGE: ${{ needs.build-image.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imagen-docker

      - name: Cargar imagenes
        run: gunzip -c imagen.tar.gz | docker load

      - name: Login en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagenes en GHCR (tag SHA, v-run y latest)
        run: |
          for IMG in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            BASE="${IMG%:*}"
            docker tag "$IMG" "$BASE:v${GITHUB_RUN_NUMBER}"
            docker tag "$IMG" "$BASE:latest"
            docker push "$IMG"
            docker push "$BASE:v${GITHUB_RUN_NUMBER}"
            docker push "$BASE:latest"
          done

      - name: Crear release con el commit y las imagenes (trazabilidad)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Commit %s\n\n- Backend: %s\n- Frontend: %s\n- Pipeline: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notas.md
          gh release create "v${GITHUB_RUN_NUMBER}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release v${GITHUB_RUN_NUMBER}" \
            --notes-file notas.md

  # ── 7. Validacion de esquema de los manifiestos de Kubernetes ──
  validar-k8s:
    name: Validar manifiestos Kubernetes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: kubeconform - validar esquema de los manifiestos
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  # ── 8. Orquestacion real: despliega en un cluster Kubernetes efimero (kind) ──
  k8s-kind:
    name: Probar en Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [build-image, scan-image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imagen-docker

      - name: Cargar imagenes
        run: gunzip -c imagen.tar.gz | docker load

      - name: Crear cluster kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: pedidos360

      - name: Cargar imagenes en el cluster y apuntar los manifiestos al SHA
        env:
          BACKEND_IMAGE: ${{ needs.build-image.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.build-image.outputs.frontend }}
        run: |
          kind load docker-image "$BACKEND_IMAGE" "$FRONTEND_IMAGE" --name pedidos360
          sed -i "s#image: ghcr.io/bluepoint25/pedidos360-backend:latest#image: $BACKEND_IMAGE#; s#imagePullPolicy: Always#imagePullPolicy: IfNotPresent#" k8s/backend.yaml
          sed -i "s#image: ghcr.io/bluepoint25/pedidos360-frontend:latest#image: $FRONTEND_IMAGE#; s#imagePullPolicy: Always#imagePullPolicy: IfNotPresent#" k8s/frontend.yaml

      - name: Aplicar manifiestos (el Secret se crea fuera del repositorio)
        run: |
          kubectl create namespace pedidos360 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n pedidos360 create secret generic db-credentials \
            --from-literal=username=pedidos --from-literal=password="$(openssl rand -hex 12)"
          kubectl apply -f k8s/postgres.yaml -f k8s/backend.yaml -f k8s/frontend.yaml

      - name: Esperar a que los pods esten listos
        run: |
          kubectl -n pedidos360 rollout status statefulset/db --timeout=180s
          kubectl -n pedidos360 rollout status deployment/backend --timeout=240s
          kubectl -n pedidos360 rollout status deployment/frontend --timeout=120s
          kubectl -n pedidos360 get pods,svc,hpa

      - name: Smoke test dentro del cluster y verificacion del commit
        run: |
          kubectl -n pedidos360 port-forward svc/backend 18080:80 &
          sleep 5
          curl -fsS http://localhost:18080/info | tee info.json
          echo
          grep -q "\"commit\":\"${GITHUB_SHA}\"" info.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/productos)" = "401"

      - name: Diagnostico si falla
        if: failure()
        run: |
          kubectl -n pedidos360 get pods -o wide
          kubectl -n pedidos360 describe pods | tail -80
          kubectl -n pedidos360 logs deployment/backend --tail=80 || true
