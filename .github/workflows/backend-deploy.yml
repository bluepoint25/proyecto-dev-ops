name: Backend - Despliegue

# Pipeline 2 de 4: construye la imagen Docker, la sube a ECR y redespliega ECS.
# Requiere secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: pedidos360-backend
  CLUSTER: pedidos360-cluster
  SERVICE: pedidos360-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen (linux/amd64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$ECR_REPO:latest .
          docker push $REGISTRY/$ECR_REPO:latest

      - name: Redesplegar el servicio ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
