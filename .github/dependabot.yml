# Escaneo automatico de dependencias (IE3): Dependabot abre PRs hacia develop
# cuando hay versiones nuevas o vulnerabilidades en cada ecosistema.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, ci]
