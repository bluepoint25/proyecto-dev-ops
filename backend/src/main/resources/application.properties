# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=8080

# ─── Resource Server: valida JWT emitido por Cognito ─────────────────────────
# El issuer es el del User Pool. Spring descarga el JWKS automáticamente para
# verificar la firma de cada token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_zQ8E2d1J4

# ─── Base de datos ───────────────────────────────────────────────────────────
# Las variables SPRING_DATASOURCE_* se inyectan por entorno en ECS (RDS).
# Si no existen (local), usa H2 en memoria como fallback.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pedidos360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ─── Actuator: solo el health check, para ECS ────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
